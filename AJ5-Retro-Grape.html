<style>
        .product-grid-detail {
            display: grid;
            grid-template-columns: repeat(6, 1fr); 
            gap: 10px; 
            padding: 20px;
            justify-content: start;
            justify-items: start;
            margin: 0;
            width: 100%;
        }
        .detail-thumb {
            background: #111;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 150px; 
            overflow: hidden;
            transition: 0.3s;
            width: 100%; 
        }

        .detail-thumb:hover {
            border-color: #ffde59; 
            transform: translateY(-3px);
        }

        .detail-thumb img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; 
            display: block;
        }
